# All parameters of the project, in one place.
#
# Units:
#   prices  : EUR/MWh (TTF convention)
#   volumes : MWh
#   rates   : MWh/day
#   time    : years, ACT/365 day count from the valuation date

[dates]
# The valuation date is the day before the first delivery day, so every
# delivery-day price is random at valuation time.
valuation_date = "2027-03-31"
# Storage year April to March. Both dates are delivery days (inclusive).
# 2027-04-01 to 2028-03-31 has 366 days (it contains 29 February 2028).
start_date = "2027-04-01"
end_date = "2028-03-31"

[contract]
working_volume = 1000000.0      # WGV = 1 TWh
initial_inventory = 0.0         # inventory at the start of the first day
final_inventory = 0.0           # required inventory at the end of the last day
# Maximum daily rates at full ratchet (fraction 1.0), given as the number of
# days needed to fill or empty the whole working volume at that rate.
full_injection_days = 150.0     # max injection rate = WGV / 150 per day
full_withdrawal_days = 90.0     # max withdrawal rate = WGV / 90 per day
injection_cost = 0.20           # EUR per MWh injected
withdrawal_cost = 0.10          # EUR per MWh withdrawn
discount_rate = 0.03            # continuously compounded, per year

# Ratchets: piecewise-linear maximum rate as a function of fill level
# (inventory / WGV), as a fraction of the maximum rate. Points are linearly
# interpolated. The rate applies to the inventory at the start of each day.
[contract.injection_ratchet]
fill_levels = [0.0, 0.7, 1.0]
rate_fractions = [1.0, 1.0, 0.5]

[contract.withdrawal_ratchet]
fill_levels = [0.0, 0.3, 1.0]
rate_fractions = [0.4, 1.0, 1.0]

[model]
# Two-factor Schwartz-Smith model under the pricing measure Q (annualised).
kappa = 4.0         # mean-reversion speed of the short-term factor (half-life ln2/kappa ~ 2 months)
sigma_chi = 0.70    # volatility of the short-term factor chi
sigma_xi = 0.25     # volatility of the long-term factor xi
rho = -0.2          # correlation between the two Brownian motions
mu_xi = 0.0         # drift of xi (any constant drift is absorbed by the seasonal term)
chi0 = 0.0          # initial short-term factor
xi0 = 0.0           # initial long-term factor (level is absorbed by the seasonal term)

[forward_curve]
# Synthetic monthly TTF-like forward curve for the storage year, EUR/MWh.
# Summer months are cheaper than winter months (summer-winter spread ~ 8 EUR/MWh).
months = ["2027-04", "2027-05", "2027-06", "2027-07", "2027-08", "2027-09",
          "2027-10", "2027-11", "2027-12", "2028-01", "2028-02", "2028-03"]
prices = [31.0, 29.5, 29.0, 29.5, 30.0, 31.0,
          33.0, 36.0, 38.5, 39.5, 38.5, 35.0]

[simulation]
seed = 20270401
n_paths_check = 20000   # paths for the Step 1 Monte Carlo checks
n_paths_plot = 8        # paths shown on the path plot
confidence_level = 0.95
# Observation date for the futures martingale check (end of injection season).
martingale_check_date = "2027-09-30"

[intrinsic]
# Inventory grid steps (MWh) for the dynamic-programming cross-check of the LP.
# Daily trades in the DP are whole multiples of the grid step, so the DP value
# is a lower bound of the LP value that converges as the step goes to zero.
dp_grid_steps = [500.0, 250.0, 100.0, 50.0, 25.0]

[lsmc]
# Least-Squares Monte Carlo (Boogert and de Jong, 2008).
n_levels = 101                 # inventory grid levels per day
# "adaptive": levels equally spaced on the reachable band [L_d, U_d] (default, converged at 51 levels).
# "fixed": levels on [0, WGV] every day, with a terminal penalty (converges slowly from below).
grid_type = "adaptive"
action_fractions = [0.0, 1.0]  # bang-bang: withdraw at max (0), inject at max (1); "do nothing" is always added
# Regression basis: "factors" = polynomials in the standardised factors (chi, xi), the
# full Markov state of the price model (default); "spot" = polynomials in the spot price only.
basis = "factors"
polynomial_degree = 3          # total degree: 10 terms in (chi, xi), 4 terms in S
terminal_penalty = 1000.0      # EUR/MWh missed at maturity (fixed grid only; backward step only)
n_paths_regression = 10000     # in-sample paths used to fit the regressions
seed_regression = 1

[valuation]
# Fresh out-of-sample paths, shared by all methods for comparison.
n_paths = 20000
seed = 2
n_paths_perfect_foresight = 1000   # subset used for the perfect-foresight upper bound

[rolling_intrinsic]
reoptimisation_interval_days = 7   # re-solve the LP weekly
n_workers = 8                      # parallel processes (paths are independent)
n_paths_daily_check = 500          # subset re-run with daily re-optimisation (weekly vs daily)

[nn_policy]
# Neural network policy trained by Monte Carlo gradient (one network for all days).
hidden_sizes = [64, 64]
batch_size = 2048            # fresh simulated paths per iteration
n_iterations = 10000        # 3000 left the validation value still rising; see results/archive
learning_rate = 1e-3         # Adam, cosine decay to learning_rate / 20
gradient_clip = 1.0
seed_torch = 7               # network initialisation
seed_training = 100          # training paths (independent of regression/valuation seeds)
n_paths_validation = 5000    # monitoring and best-weights selection only
seed_validation = 4
validate_every = 100
